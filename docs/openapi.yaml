components:
  schemas:
    ACLRule:
      type: object
      description: Serializer for ACLRule resources.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        service:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 63
        key_prefix:
          type: string
          readOnly: true
        priority:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        src:
          type: string
          format: uuid
          nullable: true
        src_group:
          type: string
          format: uuid
          nullable: true
        dst:
          type: string
          format: uuid
          nullable: true
        dst_group:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - key_prefix
      - name
      - service
      - updated_at
