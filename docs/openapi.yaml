  /api/v1/acl-rules/:
    get:
      operationId: v1_acl_rules_list
      description: CRUD endpoints for ACLRule resources.
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ACLRule'
          description: ''
    post:
      operationId: v1_acl_rules_create
      description: Create or return an existing ACLRule.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ACLRule'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ACLRule'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ACLRule'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACLRule'
          description: ''
  /api/v1/acl-rules/{id}/:
    get:
      operationId: v1_acl_rules_retrieve
      description: CRUD endpoints for ACLRule resources.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this acl rule.
        required: true
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACLRule'
          description: ''
    put:
      operationId: v1_acl_rules_update
      description: Update an ACLRule with Squid config validation.
